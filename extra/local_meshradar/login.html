<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// Same synchronous pre-paint theme pick as dashboard.html, so a stored
// light/dark preference carries over here instead of flashing dark once.
(function () {
    var saved = localStorage.getItem('meshradar_theme');
    if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
    }
})();
</script>
<title>Local Meshradar &mdash; Sign In</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* Same theme tokens as dashboard.html, so this reads as the front
       door of the same tool rather than a bolted-on auth page. */
    :root {
        color-scheme: dark;
        --bg: #0a0e17;
        --panel: #162033;
        --border: #233049;
        --text: #e2e8f0;
        --dim: #94a3b8;
        --accent: #06b6d4;
        --accent-green: #00e5a0;
        --accent-red: #ef4444;
    }
    @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
            color-scheme: light;
            --bg: #f4f6fb;
            --panel: #ffffff;
            --border: #dbe1ec;
            --text: #1a2233;
            --dim: #64748a;
            --accent: #0891b2;
            --accent-green: #059669;
            --accent-red: #dc2626;
        }
    }
    :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f6fb;
        --panel: #ffffff;
        --border: #dbe1ec;
        --text: #1a2233;
        --dim: #64748a;
        --accent: #0891b2;
        --accent-green: #059669;
        --accent-red: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        font-family: 'JetBrains Mono', ui-monospace, "SF Mono", Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .auth-card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        animation: bootIn 420ms ease-out both;
    }
    @keyframes bootIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .auth-radar { width: 180px; height: 180px; margin: 0 auto; position: relative; border-radius: 50%; }
    .auth-radar svg { position: absolute; inset: 0; }
    .auth-radar__sweep {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(
            from 0deg,
            rgba(6, 182, 212, 0.2) 0deg,
            rgba(6, 182, 212, 0.08) 40deg,
            rgba(6, 182, 212, 0) 90deg,
            rgba(6, 182, 212, 0) 360deg
        );
        animation: spin 6s linear infinite;
        mask: radial-gradient(circle at center, black 0%, black 99%, transparent 100%);
        -webkit-mask: radial-gradient(circle at center, black 0%, black 99%, transparent 100%);
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .auth-radar__center {
        position: absolute; top: 50%; left: 50%;
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent-green);
        transform: translate(-50%, -50%);
        box-shadow: 0 0 6px var(--accent-green), 0 0 14px rgba(0, 229, 160, 0.5);
    }
    .auth-radar__center::after {
        content: ''; position: absolute; inset: -8px; border-radius: 50%;
        border: 1px solid rgba(0, 229, 160, 0.4);
        animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
        0%   { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
        .auth-radar__sweep, .auth-radar__center::after, .auth-card { animation: none !important; }
    }

    .auth-identity {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
        text-align: center;
        line-height: 1.6;
    }
    .auth-identity__name { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
    .auth-identity__meta { font-size: 11px; color: var(--dim); }
    .auth-identity__live { color: var(--accent-green); }

    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        padding: 10px 12px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15); }
    .auth-input--error { border-color: var(--accent-red); animation: shake 0.35s ease-out; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }
    .auth-error { font-size: 11px; color: var(--accent-red); min-height: 14px; padding-left: 2px; }

    .auth-button {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #071019;
        border: none;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: box-shadow 0.15s, opacity 0.15s;
    }
    .auth-button:hover:not(:disabled) { box-shadow: 0 0 14px rgba(6, 182, 212, 0.55); }
    .auth-button:disabled { opacity: 0.4; cursor: not-allowed; }
    .auth-button--loading .auth-button__label,
    .auth-button--loading .auth-button__arrow { display: none; }
    .auth-button--loading .auth-button__dots { display: inline-flex; }
    .auth-button__dots { display: none; gap: 5px; }
    .auth-button__dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #071019;
        animation: dotPulse 1.1s ease-in-out infinite;
    }
    .auth-button__dots span:nth-child(2) { animation-delay: 0.2s; }
    .auth-button__dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    .auth-footer { text-align: center; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div class="auth-card">
    <div class="auth-radar">
        <svg viewBox="0 0 180 180" preserveAspectRatio="xMidYMid meet">
            <circle cx="90" cy="90" r="26" fill="none" stroke="var(--border)" stroke-width="1"/>
            <circle cx="90" cy="90" r="52" fill="none" stroke="var(--border)" stroke-width="1"/>
            <circle cx="90" cy="90" r="78" fill="none" stroke="var(--border)" stroke-width="1"/>
        </svg>
        <div class="auth-radar__sweep"></div>
        <div class="auth-radar__center"></div>
    </div>

    <div class="auth-identity">
        <div class="auth-identity__name">Local Meshradar</div>
        <div class="auth-identity__meta">self-hosted &middot; <span class="auth-identity__live">receiving</span></div>
    </div>

    <form class="auth-form" id="auth-form" novalidate>
        <input type="text" class="auth-input" id="username-input" placeholder="username" autocomplete="username" autofocus>
        <input type="password" class="auth-input" id="password-input" placeholder="password" autocomplete="current-password">
        <div class="auth-error" id="error-msg" role="alert" aria-live="polite"></div>
        <button type="submit" class="auth-button" id="submit-btn">
            <span class="auth-button__label">Unlock</span>
            <span class="auth-button__arrow">&rsaquo;</span>
            <span class="auth-button__dots"><span></span><span></span><span></span></span>
        </button>
    </form>

    <div class="auth-footer">local meshradar &middot; unofficial dev tooling</div>
</div>

<script>
// Strict allowlist for the post-login redirect target, mirroring the
// real Meshpoint app's _safeNextPath (frontend/js/auth.js) -- accepts
// only same-origin paths so a hostile ?next= can't bounce a freshly
// authenticated session off this device.
function safeNextPath(search) {
    const params = new URLSearchParams(search);
    const next = params.get('next');
    if (typeof next !== 'string' || next.length === 0 || next.length > 512) return '/';
    if (next[0] !== '/') return '/';
    if (next.startsWith('//') || next.startsWith('/\\')) return '/';
    if (next.includes('://')) return '/';
    if (!/^[A-Za-z0-9._~/?=&%#-]+$/.test(next)) return '/';
    return next;
}

const form = document.getElementById('auth-form');
const usernameInput = document.getElementById('username-input');
const passwordInput = document.getElementById('password-input');
const errorEl = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

function setLoading(on) {
    submitBtn.classList.toggle('auth-button--loading', on);
    submitBtn.disabled = on;
}
function showError(message) {
    errorEl.textContent = message;
    passwordInput.classList.add('auth-input--error');
    setTimeout(() => passwordInput.classList.remove('auth-input--error'), 400);
}
passwordInput.addEventListener('input', () => { errorEl.textContent = ''; });

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) { showError('Enter a username and password.'); return; }

    setLoading(true);
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
            credentials: 'same-origin',
        });
        setLoading(false);
        if (res.ok) {
            window.location.replace(safeNextPath(window.location.search));
            return;
        }
        showError('Wrong username or password.');
    } catch (_) {
        setLoading(false);
        showError('Network error. Check the connection.');
    }
});
</script>
</body>
</html>
