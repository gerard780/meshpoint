# Native splash screen shown while the app boots, before Flutter's own
# UI can render -- same real meshpoint icon as the launcher icon
# (assets/icon/icon.png), on the same dark background every one of the
# app's 3 themes uses (see lib/theme/meshpoint_theme.dart -- there's no
# actual light theme to branch on here, all three are dark variants).
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0a0e17"
  image: assets/icon/icon.png

  color_dark: "#0a0e17"
  image_dark: assets/icon/icon.png

  android_12:
    color: "#0a0e17"
    # Android 12+'s splash-screen API renders this inside its own fixed
    # icon window (sized like an adaptive icon, visual content expected
    # within the inner ~66% safe zone) -- the plain icon.png fills its
    # canvas edge-to-edge with no margin, so the OS zoomed into it and
    # cropped the wordmark. This padded variant leaves real transparent
    # margin so the OS's own scaling lands on a correctly-framed badge.
    image: assets/icon/icon_splash_android12.png
    color_dark: "#0a0e17"
    image_dark: assets/icon/icon_splash_android12.png

  web: false
  android: true
  ios: true
